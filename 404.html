<!DOCTYPE html>
<html lang="en">
<head>
    <title>404</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        @font-face {font-family:'Droid Sans';src:url('/meta/droid-sans.ttf') format('truetype'), url('/meta/droid-sans-bold.ttf') format('truetype');font-weight:normal;font-style:normal;}
        body {font-family:'Droid Sans',sans-serif;margin:0}
        h2 {font-size:large}
        article {width:250px;padding-left:6px}
        summary {color:grey;list-style:none;cursor:pointer;font-weight:bold;font-style:italic}
    </style>
</head>
<body>

<article>
    <img src="/meta/404-peek.svg" width="50px">
    <h1>Webpage not found</h1>
    <p>The webpage at <b id="URI">about:blank</b> could not be loaded because:</p>
    <p>net::ERR_FILE_NOT_FOUND</p>
    <h2>Suggestions</h2>
    <ul>
        <li>Make sure you have a <a href="/xtra/dino">data connection</a></li>
        <li>Reload this webpage later</li>
        <li>Check the address you entered</li>
        <li>View a cached copy of the page from <a id="wayback-machine-link" href="#" style="display:none">Wayback Machine</a></li>
    </ul>
</article>
<br>
<script>document.addEventListener('DOMContentLoaded', function() {const fullUrl = window.location.href;const dynamicUrlElement = document.getElementById('URI');if (dynamicUrlElement) {dynamicUrlElement.textContent = fullUrl;}const waybackLink = document.getElementById('wayback-machine-link'); if (waybackLink) {const waybackUrl = `https://web.archive.org/web/*/${fullUrl}`; waybackLink.href = waybackUrl; waybackLink.textContent = 'Wayback Machine'; waybackLink.style.display = 'inline';}});</script>

</body>
</html>

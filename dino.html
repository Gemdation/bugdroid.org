    <meta name="theme-color" content="#ACACAC">

    <meta property="og:title" content="Chrome Dino Merchandise">

    <script src="meta/site-board.js" defer></script>
    <script src="meta/site-database-dino.js" defer></script>
    <style>
        @font-face {font-family:'Dino';font-display:swap;src:url('meta/dino.ttf') format('truetype');font-weight:normal;font-style:normal;}
        body {font-family:'Dino',sans-serif}
        button {font-family:'Dino';color:grey;box-shadow:none;background:#ffffff;}
        button:active, img.i:active {background:#464646}
        button:disabled {color:#ACACAC}
        a, mark, nav a:hover {color:#929292}
        div.board img {border:solid 3px #ACACAC;outline:solid 1px black}
        div.board img:hover, img.i:hover {outline:solid 1px #E99D00}
        div.board img:active {border:solid 3px #E99D00}
        h2 {font-size:2em;}
        header {background:#ACACAC}
        header, p, li {font-size:1.5em}
        header button {vertical-align:middle;}
        ::selection {background:#ACACAC;color:white}
    </style>
</head>
<body>

<nav><header style="text-shadow:none;color:white"><a href="/">bugdroid.org</a>/dino</header></nav>


<h1 class="branding"><img src="meta/logo-dino.webp" id="dinoImg" alt="Retro-styled dinosaur and cactus" style="width:200px;cursor:help"><audio id="dinoSound1" src="meta/fx-dino-1.ogg"></audio><audio id="dinoSound2" src="meta/fx-dino-2.ogg"></audio><audio id="dinoSound3" src="meta/fx-dino-3.ogg"></audio></h1>
    <script>document.getElementById("dinoImg").addEventListener("click", () => {const soundIDs = ["dinoSound1", "dinoSound2", "dinoSound3"]; const randomID = soundIDs[Math.floor(Math.random() * soundIDs.length)]; const sound = document.getElementById(randomID); sound.currentTime = 0; sound.play();});</script>

<p class="branding"><a href="https://gemdation.com"><img src="meta/button-gemdation.com.gif" class="i" alt="Gemdation web button"></a> <a href="https://github.com/Gemdation/bugdroid.org"><img src="meta/button-dino.gif" class="i" alt="YouTube web button"></a></p>

<!--begin the JS stuff-->

<div id="prod">
    <button onclick="returnToBrowse()" style="font-size:1.2em;margin-top:5px">Close</button>
    <div class="individual">
        <div class="box" id="Gallery">
            <img src="" id="prod-images" alt="" style="width:100%">
            <header><button id="prev-button" onclick="prevSlide()">◀</button> <button id="next-button" onclick="nextSlide()">▶</button></header>
        </div>

        <div class="box" id="About">
            <h2 style="margin-left:10px"><span id="prod-name"></span></h2>
            <p><span id="prod-descrip"></span></p>
            <ul>
                <li><mark>Manufacturer:</mark> <span id="prod-maker"></span></li>
                <li><mark>Release Year:</mark> <span id="prod-year"></span></li>
                <li><mark>ID:</mark> <span id="prod-id"></span></li>
                <li><mark>Price:</mark> <span id="prod-price"></span></li>
            </ul>
        </div>
    </div>
</div>

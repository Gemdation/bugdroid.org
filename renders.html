<!DOCTYPE html>
<html lang="en">
<head>
    <title>Droid Renders</title>
    <meta name="description" content="Renders of Bugdroid, version logos, and app icons.">
    <meta name="theme-color" content="#A4C639">
    <meta name="keywords" content="Renders, images, photos, Bugdroid, Droid, Android, Google">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="Droid Renders">
    <meta property="og:description" content="Renders of Bugdroid, version logos, and app icons.">
    <meta property="og:url" content="https://bugdroid.org/renders">
    <meta property="og:image" content="https://bugdroid.org/meta/subpage-renders.svg">
    <meta property="og:image:alt" content="Varioua Android logo recolors standing together.">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="595">
    <meta property="og:image:type" content="image/svg+xml">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="Droid Pack">
    <link rel="stylesheet" href="meta/droid.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        /*outline: solid 1px red*/
        /*Above is code that can be added to IMG so that non-square images can be identified.*/
        div.board img {width:150px;}
        div.board img:hover {cursor:zoom-in;filter:drop-shadow(0px 0px 11px #A4C639)}
        div.board img:active {filter:none}
        div#prod {width:100%;display:none}
        #prod-images {display:block}
        .full {position:fixed;cursor:zoom-out;top:0;left:0;width:100%;height:100%;background-color:#000000b0;display:flex;justify-content:center;border:none;outline:none;align-items:center;visibility:hidden;opacity:0;}
        .full.visible {visibility:visible;opacity:1;}
        .full img {max-width:100%;max-height:90%;object-fit:contain}
    </style>
</head>
<body>

<nav><header><a href="/">bugdroid.org</a>/renders</header></nav>

<h1>Droid Renders</h1>

<div class="board">
    <br>
    <img src="media/generic/bugdroid-2008.svg">
    <img src="media/generic/bugdroid-2008-developer.webp">
    <img src="media/icons/apk-2008.webp">
    <img src="media/versions/1.0-apple-pie.webp">
    <img src="media/versions/1.1-banana-bread.webp">
    <img src="media/versions/1.5-cupcake.webp">
    <img src="media/versions/1.6-donut.svg">
    <img src="media/icons/android-market.webp">
    <img src="media/icons/aosp-messages.webp">
    <img src="media/icons/aosp-contacts.webp">
    <img src="media/versions/2.0-eclair-sq.svg">
    <img src="media/versions/2.2-froyo.svg">
    <img src="media/versions/2.3-gingerbread.webp">
    <img src="media/versions/3.0-honeycomb.webp">
    <img src="media/versions/4.0-ice-cream-sandwich.webp">
    <img src="media/versions/4.1-jellybean-jar.webp">
    <img src="media/versions/4.1-jellybean.webp">
    <img src="media/versions/4.4-internal-key-lime-pie.svg">
    <img src="media/versions/4.4-kitkat.webp">
    <img src="media/generic/bugdroid-2014.svg">
    <img src="media/generic/bugdroid-2014-jetpack.webp">
    <img src="media/versions/5.0-lollipop.webp">
    <img src="media/versions/6.0-marshmallow.webp">
    <img src="media/versions/7.0-nougat.webp">
    <img src="media/icons/my-android.webp">
    <img src="media/generic/bugdroid-2019.svg">
    <img src="media/icons/apk-2019.webp">
    <img src="media/versions/8.0-oreo.webp">
    <img src="media/versions/9.0-pie.webp">
    <img src="media/versions/14.svg">
    <img src="media/generic/bugdroid-2023.webp">
    <img src="media/versions/15.svg">
    <img src="media/versions/16.svg">
</div>

<div class="full" id="fullscreenOverlay">
    <img src="" alt="" id="fullscreenImage">
</div>

<script>
    const tinyImages = document.querySelectorAll('div.board img');
    const fullscreenOverlay = document.getElementById('fullscreenOverlay');
    const fullscreenImage = document.getElementById('fullscreenImage');

    tinyImages.forEach(image => {image.addEventListener('click', () => {
    fullscreenImage.src = image.src; fullscreenOverlay.classList.add('visible');});});
    fullscreenOverlay.addEventListener('click', () => {fullscreenOverlay.classList.remove('visible');});
</script>

</body>
</html>
